[project]
name = "neuromaestro"
version = "1.0.0"
description = "A meta-pipeline for automated multi-modal neuroimaging processing on HPC clusters"
readme = "readme.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
maintainers = [
  { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" }
]
keywords = [
  "NeuroMaestro",
  "neuroimaging",
  "fMRI",
  "BIDS",
  "HPC",
  "Slurm",
  "pipeline",
  "fMRIPrep",
  "MRIQC",
  "QSIPrep",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  # dash/plotly/dbc had breaking major releases and only the current major is exercised
  "dash>=4.0",
  "dash-cytoscape>=1.0",
  "dash-bootstrap-components>=2.0",
  "plotly>=6.0",
  # pandas 3.x and matplotlib 3.11 need Python >=3.11, so these stay one major back
  # to keep requires-python = ">=3.10" honest
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pybids>=0.17"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/GeorgiaCenterforDevelopmentalScience/NeuroMaestro"
Documentation = "https://georgiacenterfordevelopmentalscience.github.io/NeuroMaestro/"
Repository = "https://github.com/GeorgiaCenterforDevelopmentalScience/NeuroMaestro"
Issues = "https://github.com/GeorgiaCenterforDevelopmentalScience/NeuroMaestro/issues"
Changelog = "https://github.com/GeorgiaCenterforDevelopmentalScience/NeuroMaestro/blob/main/CHANGELOG.md"


[tool.pytest.ini_options]
testpaths = ["tests"]
# strict-markers turns a typo'd @pytest.mark into an error instead of a warning
addopts = "--strict-markers --strict-config"
# deprecations from pandas/plotly/dash/pybids fail now rather than on the HPC
filterwarnings = ["error"]

[tool.coverage.run]
source = ["neuromaestro"]
# this codebase branches heavily on config, so line coverage alone overstates it
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuromaestro*"]

[tool.setuptools.package-data]
"neuromaestro" = [
  "config/**/*.yaml",
  "scripts/**/*.sh",
  # sourced by the generated bash wrapper via SCRIPT_DIR
  "pipeline/utils/*.sh",
  # Dash discovers this folder relative to interface/app.py
  "interface/assets/*",
]

[project.scripts]
neuromaestro = "neuromaestro.pipeline.core:app"
neuromaestro-gui = "neuromaestro.interface.run_gui:main"