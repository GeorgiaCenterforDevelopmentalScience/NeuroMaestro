[project]
name = "neuroimage-pipe"
version = "0.17.0-alpha"
description = "Neuroimage pipeline"
readme = "readme.md"
requires-python = ">=3.10"
authors = [
  { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
maintainers = [
  { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" }
]
dependencies = [
  "typer",
  "PyYAML",
  "dash",
  "dash-cytoscape",
  "dash-bootstrap-components",
  "plotly",
  "pandas",
  "matplotlib",
  "pybids"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# strict-markers turns a typo'd @pytest.mark into an error instead of a warning
addopts = "--strict-markers --strict-config"
# deprecations from pandas/plotly/dash/pybids fail now rather than on the HPC
filterwarnings = ["error"]

[tool.coverage.run]
source = ["neuro_pipeline"]
# this codebase branches heavily on config, so line coverage alone overstates it
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["neuro_pipeline*"]

[tool.setuptools.package-data]
"neuro_pipeline" = ["config/**/*.yaml", "scripts/**/*.sh"]

[project.scripts]
neuropipe = "neuro_pipeline.pipeline.core:app"
neuropipe-gui = "neuro_pipeline.interface.run_gui:main"