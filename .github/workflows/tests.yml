name: Tests

on:
  push:
  pull_request:
    branches: [main]

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject and is otherwise untested,
        # 3.11 is what the HPC modules load, 3.14 is local development.
        # Path and pathlib behaviour differs across this range.
        python-version: ['3.10', '3.11', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q --cov --cov-report=term-missing
